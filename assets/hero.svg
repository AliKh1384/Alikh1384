    <pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse">
      <path d="M26 0H0V26" fill="none" stroke="#29435d" stroke-opacity=".28" stroke-width=".8"/>
    </pattern>
    <clipPath id="frame"><rect width="1100" height="310" rx="22"/></clipPath>
  </defs>
